<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curious Intake — CSMS</title>
<style>
  :root{
    --ink:#173A66; --paper:#F3F8FB; --card:#FFFFFF; --line:#E4EEF4; --line-2:#CFE0EA;
    --deep:#0B8FC4; --deep-2:#2FA9DA; --deep-wash:#E1F3FA;
    --sage:#4F8A66; --sage-wash:#E5F3EA; --amber:#96690F; --amber-wash:#FDF2D0; --rose:#B3571F; --rose-wash:#FCE5D5;
    --r:14px; --sh:0 1px 2px rgba(22,51,74,.05), 0 6px 18px rgba(11,143,196,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
    max-width:660px;width:100%;padding:28px 26px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:13.5px;color:var(--ink);opacity:.7;margin:0 0 20px}
  .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--deep);margin:20px 0 10px}
  .section-label:first-child{margin-top:0}
  .field{margin-bottom:16px}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink)}
  .field label .req{color:var(--rose)}
  .field input, .field select{width:100%;padding:11px 13px;font-size:14.5px;border:1px solid var(--line-2);
    border-radius:11px;background:#fff;color:var(--ink);font-family:inherit;appearance:auto}
  .field input::placeholder{color:#9CB1C4}
  .field input:focus, .field select:focus{outline:2px solid var(--deep-2);outline-offset:1px}
  .field input[readonly]{background:var(--paper);color:#9CB1C4}
  .whatsapp-row{display:flex;gap:8px}
  .whatsapp-row input[readonly]{flex:0 0 78px;text-align:center}
  .whatsapp-row input:not([readonly]){flex:1;min-width:0}
  button{width:100%;padding:11px;border:none;border-radius:999px;background:var(--deep);color:#fff;
    font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.6;cursor:default}
  button:hover:not(:disabled){background:var(--deep-2)}
  .msg{padding:14px 16px;border-radius:10px;font-size:13.5px;margin-bottom:16px}
  .msg.err{background:var(--rose-wash);color:var(--rose)}
  .msg.ok{background:var(--sage-wash);color:var(--sage)}
  .msg.warn{background:var(--amber-wash);color:var(--amber)}
  .msg.info{background:var(--deep-wash);color:var(--deep)}
  .center{text-align:center;padding:24px 0}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line-2);border-top-color:var(--deep);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:520px){ .field-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
  <div class="card" id="app">
    <div class="center"><div class="spin"></div></div>
  </div>

<script>
// Same reason index.html has this: Firebase Hosting (Spark plan) can't
// proxy /api/** to the Render backend, so this page has to call the API's
// full URL directly, not a relative path (a relative /api/... 404s on
// Firebase and gets served index.html back \u2014 which is why this was
// showing "Unexpected token '<'... is not valid JSON").
const API_BASE = 'https://csms-api.onrender.com';
const formId = new URLSearchParams(location.search).get('formId');
const previewToken = new URLSearchParams(location.search).get('previewToken');
const app = document.getElementById('app');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  if(!formId){
    app.innerHTML = `<div class="msg err">This link is missing its form ID \u2014 please use the exact link you were sent.</div>`;
    return;
  }
  let data;
  try{
    const qs = previewToken ? ('?previewToken='+encodeURIComponent(previewToken)) : '';
    const res = await fetch(API_BASE + '/api/public/intake-form/' + encodeURIComponent(formId) + qs);
    if(res.status === 404){
      app.innerHTML = `<div class="msg err">This form doesn't exist. Please check the link.</div>`;
      return;
    }
    if(res.status === 409){
      let msg = 'This form is not currently open.';
      try{ const body = await res.json(); msg = body.message || msg; }catch(e){}
      app.innerHTML = `<div class="msg warn">${esc(msg)}</div>`;
      return;
    }
    if(!res.ok){
      let detail = '';
      try{ const body = await res.json(); detail = body.message || body.error || ''; }catch(e){}
      throw new Error(detail || 'Could not load the form.');
    }
    data = await res.json();
  }catch(err){
    app.innerHTML = `<div class="msg err">Something went wrong loading this form. Please try again shortly.</div>
      <p style="font-size:11px;color:#94a3b8;margin-top:10px">Technical detail (for whoever's fixing this): ${esc(err.message||'')}</p>`;
    return;
  }
  renderForm(data);
}

function mandatoryFieldHTML(f, countries){
  const id = 'm_' + f.name;
  let input;
  let fullWidth = false;
  if(f.name === 'Sal'){
    input = `<select id="${id}"><option value="" selected disabled>Select</option>
      <option>Mr</option><option>Ms</option><option>Mrs</option><option>Dr</option><option>Prefer not to say</option></select>`;
  } else if(f.type === 'country'){
    input = `<input id="${id}" list="countryList" placeholder="Start typing\u2026" autocomplete="off" oninput="onCountryTyped()">
      <datalist id="countryList">${countries.map(c=>`<option value="${esc(c.Country_Name)}">`).join('')}</datalist>
      <input type="hidden" id="${id}_resolved">`;
  } else if(f.type === 'email'){
    input = `<input id="${id}" type="email" placeholder="you@example.com" autocomplete="email">`;
  } else if(f.type === 'number'){
    fullWidth = true;
    input = `<div class="whatsapp-row">
        <input id="m_Country_ISD_whatsapp" type="text" readonly placeholder="+ Code">
        <input id="${id}" type="tel" inputmode="numeric" placeholder="Enter WhatsApp number" autocomplete="tel">
      </div>`;
  } else {
    input = `<input id="${id}" type="text" placeholder="Enter your ${esc(f.label.toLowerCase())}" autocomplete="${f.name==='First_Name'?'given-name':f.name==='Last_Name'?'family-name':'off'}">`;
  }
  let extra = '';
  if(f.type === 'country'){
    extra = `<div class="field"><label>Country dialing code</label><input id="m_Country_ISD_display" type="text" readonly placeholder="Auto-fills once you pick a country"></div>`;
  }
  if(f.type === 'email') fullWidth = true;
  const span = fullWidth ? ' style="grid-column:1/-1"' : '';
  return `<div class="field"${span}><label for="${id}">${esc(f.label)}${f.required?' <span class="req">*</span>':''}</label>${input}</div>${extra}`;
}

// Resolves the typed country name against the real list (case-insensitive
// exact match \u2014 the datalist only offers suggestions, it doesn't force a
// choice) and fills the read-only ISD code alongside it.
function onCountryTyped(){
  const typed = (document.getElementById('m_Country_ID').value||'').trim().toLowerCase();
  const match = (window.__countries||[]).find(c=>(c.Country_Name||'').toLowerCase()===typed);
  document.getElementById('m_Country_ID_resolved').value = match ? match.Country_ID : '';
  const isd = match && match.Country_ISD ? ('+'+match.Country_ISD) : '';
  const ispEl = document.getElementById('m_Country_ISD_display');
  if(ispEl) ispEl.value = isd;
  const waEl = document.getElementById('m_Country_ISD_whatsapp');
  if(waEl) waEl.value = isd;
}

function additionalFieldHTML(f){
  const id = 'a_' + f.Question_Name.replace(/[^a-zA-Z0-9]/g,'_');
  const label = `<label for="${id}">${esc(f.Question_Name)}</label>`;
  if(f.Component_Type==='CHECKBOX'){
    const opts = (f.Question_Options||'').split(',').map(o=>o.trim()).filter(Boolean);
    if(opts.length){
      return `<div class="field"><label style="font-weight:500">${esc(f.Question_Name)}</label>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
          ${opts.map((o,i)=>`<label style="display:flex;align-items:center;gap:8px;font-weight:400">
            <input id="${id}__${i}" type="checkbox" value="${esc(o)}" style="width:auto"> ${esc(o)}</label>`).join('')}
        </div></div>`;
    }
    return `<div class="field"><label style="display:flex;align-items:center;gap:8px;font-weight:500"><input id="${id}" type="checkbox" style="width:auto"> ${esc(f.Question_Name)}</label></div>`;
  }
  // Consent gets its own visually distinct treatment (amber box) so it
  // reads as "this one matters", not just another checkbox.
  if(f.Component_Type==='CONSENT') return `<div class="field" style="background:var(--amber-wash);border:1px solid #EBD9A6;border-radius:10px;padding:12px 14px;margin-bottom:16px">
      <label style="display:flex;align-items:center;gap:8px;font-weight:600;color:var(--amber)"><input id="${id}" type="checkbox" style="width:auto" required> I agree \u2014 ${esc(f.Question_Name)}</label>
    </div>`;
  if(f.Component_Type==='INFORMATION') return `<div class="msg info">${esc(f.Question_Name)}</div>`;
  if(f.Component_Type==='WARNING') return `<div class="msg warn">${esc(f.Question_Name)}</div>`;
  if(f.Component_Type==='HIGHLIGHT') return `<div class="msg" style="background:var(--sage-wash);color:var(--sage)">${esc(f.Question_Name)}</div>`;
  const type = f.Question_Type==='DATE' ? 'date' : f.Question_Type==='INTEGER' ? 'number' : 'text';
  return `<div class="field">${label}<input id="${id}" type="${type}"></div>`;
}

function renderForm(data){
  const countries = data.countries || [];
  window.__countries = countries;
  const mandatory = data.mandatoryFields || [];
  const additional = data.additionalFields || [];
  const previewBanner = data.isPreview
    ? `<div class="msg warn"><b>Preview \u2014 ${esc(data.formStatus||'')}.</b> This is exactly what the live form looks like. Nothing you submit here is saved.</div>`
    : '';
  app.innerHTML = `
    ${previewBanner}
    ${data.formTitle ? `<h1 style="margin:0 0 6px;font-size:24px;font-weight:700;color:var(--ink)">${esc(data.formTitle)}</h1>` : ''}
    <p class="sub" style="font-size:14.5px;color:var(--ink);opacity:1;margin-bottom:20px">${esc(data.formDesc || 'Tell us a bit about you \u2014 it only takes a minute.')}</p>
    <div id="formErr"></div>
    <form id="intakeForm">
      <div class="field-grid">${mandatory.map(f=>mandatoryFieldHTML(f, countries)).join('')}</div>
      ${additional.length ? additional.map(additionalFieldHTML).join('') : ''}
    </form>
    <button type="button" id="submitBtn" onclick="submitForm(${data.isPreview ? 'true' : 'false'})">Submit</button>
  `;
  window.__mandatoryDefs = mandatory;
  window.__additionalDefs = additional;
}

async function submitForm(isPreview){
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('formErr');
  errEl.innerHTML = '';

  const mandatory = {};
  let missing = [];
  (window.__mandatoryDefs||[]).forEach(f=>{
    let val;
    if(f.type==='country'){
      val = (document.getElementById('m_Country_ID_resolved').value||'').trim();
      if(f.required && !val) missing.push(f.label+' (pick one from the list)');
    } else {
      const el = document.getElementById('m_'+f.name);
      val = el ? el.value.trim() : '';
      if(f.required && !val) missing.push(f.label);
    }
    mandatory[f.name] = val || null;
  });
  if(missing.length){
    errEl.innerHTML = `<div class="msg err">Please fill in: ${esc(missing.join(', '))}</div>`;
    return;
  }

  // Preview mode never calls the real submit endpoint \u2014 the server
  // wouldn't accept it anyway (it only ever accepts Published forms,
  // preview token or not), so this is just an honest client-side stand-in.
  if(isPreview){
    app.innerHTML = `<div class="msg ok">This is what the confirmation looks like. Nothing was actually submitted \u2014 you're in Preview.</div>`;
    return;
  }

  const additional = {};
  (window.__additionalDefs||[]).forEach(f=>{
    const id = 'a_' + f.Question_Name.replace(/[^a-zA-Z0-9]/g,'_');
    const opts = f.Component_Type==='CHECKBOX' ? (f.Question_Options||'').split(',').map(o=>o.trim()).filter(Boolean) : [];
    if(f.Component_Type==='CHECKBOX' && opts.length){
      const checked = opts.filter((o,i)=>{
        const el = document.getElementById(id+'__'+i);
        return el && el.checked;
      });
      additional[f.Question_Name] = checked.join(', ');
      return;
    }
    const el = document.getElementById(id);
    if(!el) return;
    if(f.Component_Type==='CHECKBOX' || f.Component_Type==='CONSENT') additional[f.Question_Name] = el.checked ? 'Yes' : '';
    else additional[f.Question_Name] = el.value;
  });

  btn.disabled = true; btn.textContent = 'Submitting\u2026';
  try{
    const res = await fetch(API_BASE + '/api/public/intake-form/' + encodeURIComponent(formId), {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({mandatory, additional})
    });
    if(!res.ok){
      let detail = '';
      try{ const body = await res.json(); detail = body.message || body.error || ''; }catch(e){}
      throw new Error(detail || 'Submit failed');
    }
    app.innerHTML = `<div class="msg ok">Thank you \u2014 your response has been recorded.</div>`;
  }catch(err){
    errEl.innerHTML = `<div class="msg err">Could not submit \u2014 please check your connection and try again.</div>`;
    btn.disabled = false; btn.textContent = 'Submit';
  }
}

init();
</script>
</body>
</html>
