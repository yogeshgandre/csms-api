<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satsang Form — CSMS</title>
<style>
  /* Soft-blue palette, shared with the seeker profile cards and the public
     intake form so every seeker-facing surface reads as one system. */
  :root{
    --ink:#173A66; --paper:#F3F8FB; --card:#FFFFFF; --line:#E4EEF4; --line-2:#CFE0EA;
    --deep:#0B8FC4; --deep-2:#2FA9DA; --deep-wash:#E1F3FA;
    --ink-soft:#4A6690; --muted:#7088A7;
    --sage:#4F8A66; --sage-wash:#E5F3EA; --rose:#B3571F; --rose-wash:#FCE5D5;
    --r:20px; --sh:0 30px 60px -35px rgba(23,58,102,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial, Helvetica, sans-serif;
    background-image:radial-gradient(circle at 15% -5%, rgba(43,131,198,.10), transparent 40%),
                     radial-gradient(circle at 100% 15%, rgba(43,131,198,.08), transparent 45%);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px}
  .card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh);
    max-width:620px;width:100%;padding:36px}
  h1{font-size:24px;font-weight:700;margin:0 0 10px;color:var(--ink);line-height:1.3}
  .sub{font-size:14.5px;color:var(--muted);margin:0 0 30px;padding-bottom:26px;border-bottom:1px solid var(--line-2)}
  .sub strong{color:var(--ink-soft);font-weight:600}

  .field{margin-bottom:30px}
  .field:last-of-type{margin-bottom:0}
  .field label{display:block;font-size:14.5px;font-weight:700;color:var(--ink);margin:0 0 12px}
  .field input, .field select, .field textarea{width:100%;padding:12px 14px;font-size:15px;
    border:1.5px solid var(--line-2);border-radius:10px;background:#fff;color:var(--ink);
    font-family:inherit;outline:none;transition:border-color .15s ease, box-shadow .15s ease}
  .field textarea{resize:vertical;min-height:110px}
  .field input::placeholder, .field textarea::placeholder{color:#a9b6c8}
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--deep-2);box-shadow:0 0 0 4px rgba(43,131,198,.15)}

  /* Daily fields: one column per day, Sun through Sat. */
  .day-row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day-col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .day-label{font-size:12px;font-weight:600;color:var(--muted)}
  .day-input{width:100%;text-align:center;padding:10px 4px;font-family:inherit;font-size:14px;
    border:1.5px solid var(--line-2);border-radius:8px;background:#fff;color:var(--ink);outline:none;
    transition:border-color .15s ease, box-shadow .15s ease}
  .day-input:focus{border-color:var(--deep-2);box-shadow:0 0 0 4px rgba(43,131,198,.15)}
  .day-done{width:100%;padding:10px 4px;font-size:13px;font-weight:600;border-radius:8px;
    background:var(--deep-wash);color:var(--deep);text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  button{width:100%;margin-top:34px;padding:15px;border:none;border-radius:999px;
    background:linear-gradient(135deg, var(--deep-2) 0%, var(--deep) 100%);color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.01em;
    box-shadow:0 14px 28px -12px rgba(11,143,196,.5);
    transition:transform .12s ease, box-shadow .15s ease}
  button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 18px 34px -12px rgba(11,143,196,.55)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.6;cursor:default;box-shadow:none}

  .msg{padding:14px 16px;border-radius:10px;font-size:14px;margin-bottom:16px}
  .msg.err{background:var(--rose-wash);color:var(--rose)}
  .msg.ok{background:var(--sage-wash);color:var(--sage)}
  .center{text-align:center;padding:24px 0}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line-2);border-top-color:var(--deep);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:480px){
    body{padding:28px 14px}
    .card{padding:26px 18px}
    .day-row{gap:5px}
    .day-input{padding:8px 2px;font-size:12.5px}
    .day-label{font-size:10.5px}
  }
</style>
</head>
<body>
  <div class="card" id="app">
    <div class="center"><div class="spin"></div></div>
  </div>

<script>
// Same reason index.html has this: Firebase Hosting (Spark plan) can't
// proxy /api/** to the Render backend, so this page has to call the API's
// full URL directly, not a relative path (a relative /api/... 404s on
// Firebase and gets served index.html back \u2014 which shows up as
// "Unexpected token '<'... is not valid JSON").
const API_BASE = 'https://csms-api.onrender.com';
const token = new URLSearchParams(location.search).get('token');
const app = document.getElementById('app');
let CURRENT_FIELDS = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  if(!token){
    app.innerHTML = `<div class="msg err">This link is missing its token — please use the exact link you were sent.</div>`;
    return;
  }
  let data;
  try{
    const res = await fetch(API_BASE + '/api/public/satsang-form/' + encodeURIComponent(token));
    if(res.status === 404){
      app.innerHTML = `<div class="msg err">This link isn't valid. Please check you copied the whole link, or ask for a new one.</div>`;
      return;
    }
    if(res.status === 409){
      app.innerHTML = `<div class="msg ok">This form has already been submitted \u2014 thank you!</div>`;
      return;
    }
    if(!res.ok){
      let detail = '';
      try{ const body = await res.json(); detail = body.message || body.error || ''; }catch(e){}
      throw new Error(detail || 'Could not load the form.');
    }
    data = await res.json();
  }catch(err){
    app.innerHTML = `<div class="msg err">Something went wrong loading this form. Please try again shortly.</div>
      <p style="font-size:11px;color:#94a3b8;margin-top:10px">Technical detail (for whoever's fixing this): ${esc(err.message||'')}</p>`;
    return;
  }
  renderForm(data);
}

function renderForm(data){
  CURRENT_FIELDS = data.fields || [];
  const when = data.eventTime ? new Date(data.eventTime).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}) : '';
  app.innerHTML = `
    <h1>${esc(data.satsangName)}${when ? ' \u2014 '+esc(when) : ''}${data.eventCity ? ' \u00b7 '+esc(data.eventCity) : ''}</h1>
    <p class="sub">${data.seekerName ? '<strong>'+esc(data.seekerName)+'</strong>' : ''}</p>
    <div id="formErr"></div>
    <form id="satsangForm"></form>
    <button type="button" id="submitBtn" onclick="submitForm()">Submit</button>
  `;
  const formEl = document.getElementById('satsangForm');
  const fields = data.fields || [];
  if(!fields.length){
    formEl.innerHTML = `<p class="sub">No additional details are needed for this satsang \u2014 just tap Submit to confirm.</p>`;
    return;
  }
  const openFields = fields.filter(f=>!(f.Review_Frequency==='Daily' ? (f.week||[]).every(d=>d.submitted) : f.alreadySubmitted));
  formEl.innerHTML = fields.map(f=>{
    const id = 'f_' + f.Field_Name.replace(/[^a-zA-Z0-9]/g,'_');
    const cadenceNote = f.Review_Frequency==='Daily' ? ' (daily)' : f.Review_Frequency==='Weekly' ? ' (weekly)' : '';
    if(f.Review_Frequency==='Daily'){
      const week = f.week || [];
      const dayInput = (d,i) => d.submitted
        ? `<div class="day-col"><div class="day-label">${esc(d.label)}</div><div class="day-done" title="Submitted">${esc(d.value||'\u2713')}</div></div>`
        : `<div class="day-col"><div class="day-label">${esc(d.label)}</div>${
            f.Field_Data_Type==='boolean'
              ? `<select id="${id}__${d.date}" class="day-input"><option value="">\u2014</option><option value="Yes">Y</option><option value="No">N</option></select>`
              : `<input id="${id}__${d.date}" class="day-input" type="${f.Field_Data_Type==='number'?'number':f.Field_Data_Type==='date'?'date':'text'}">`
          }</div>`;
      return `<div class="field"><label>${esc(f.Field_Name)}${cadenceNote}</label>
        <div class="day-row">${week.map(dayInput).join('')}</div></div>`;
    }
    if(f.alreadySubmitted){
      const periodNote = f.Review_Frequency==='Weekly' ? 'Submitted for this week.' : 'Already submitted.';
      return `<div class="field"><label>${esc(f.Field_Name)}${cadenceNote}</label>
        <div class="msg ok" style="margin-bottom:0">${esc(periodNote)}${f.lastValue?(' Last answer: '+esc(f.lastValue)):''}</div></div>`;
    }
    let input;
    if(f.Field_Data_Type === 'number') input = `<input id="${id}" type="number" step="any" placeholder="Enter a number">`;
    else if(f.Field_Data_Type === 'date') input = `<input id="${id}" type="date">`;
    else if(f.Field_Data_Type === 'boolean') input = `<select id="${id}"><option value="">Choose\u2026</option><option value="Yes">Yes</option><option value="No">No</option></select>`;
    // Free-text answers get a textarea \u2014 these are reflective questions
    // (bhav efforts, learnings), not one-word values.
    else input = `<textarea id="${id}" rows="3" placeholder="Share your ${esc(f.Field_Name.toLowerCase())}\u2026"></textarea>`;
    return `<div class="field"><label for="${id}">${esc(f.Field_Name)}${cadenceNote}</label>${input}</div>`;
  }).join('');
  if(!openFields.length){
    document.getElementById('submitBtn').style.display = 'none';
  }
}

async function submitForm(){
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('formErr');
  errEl.innerHTML = '';
  const values = {};
  (CURRENT_FIELDS||[]).forEach(f=>{
    if(f.Review_Frequency==='Daily'){
      const id = 'f_' + f.Field_Name.replace(/[^a-zA-Z0-9]/g,'_');
      const dayValues = {};
      (f.week||[]).forEach(d=>{
        if(d.submitted) return;
        const el = document.getElementById(id+'__'+d.date);
        if(el && el.value !== '') dayValues[d.date] = el.value;
      });
      if(Object.keys(dayValues).length) values[f.Field_Name] = dayValues;
      return;
    }
    if(f.alreadySubmitted) return;
    const id = 'f_' + f.Field_Name.replace(/[^a-zA-Z0-9]/g,'_');
    const input = document.getElementById(id);
    if(!input) return;
    values[f.Field_Name] = input.value;
  });
  btn.disabled = true; btn.textContent = 'Submitting\u2026';
  try{
    const res = await fetch(API_BASE + '/api/public/satsang-form/' + encodeURIComponent(token), {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({values})
    });
    if(!res.ok) throw new Error('Submit failed');
    app.innerHTML = `<div class="msg ok">Thank you \u2014 your response has been recorded. This link stays valid for anything that needs a daily or weekly check-in.</div>`;
  }catch(err){
    errEl.innerHTML = `<div class="msg err">Could not submit \u2014 please check your connection and try again.</div>`;
    btn.disabled = false; btn.textContent = 'Submit';
  }
}

init();
</script>
</body>
</html>
